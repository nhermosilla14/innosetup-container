name: Build and push container image

on:
  push:
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      version:
        description: Inno Setup version to package
        required: true
        type: string

env:
  IMAGE_REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAGS: ${{ github.sha }}
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ github.token }}


jobs:
  build_x86:
    name: Build and push x86 image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Push to Registry action
        uses: actions/checkout@v4

      - name: Determine Inno Setup version
        id: semver
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version='${{ inputs.version }}'
          else
            version="${GITHUB_REF#refs/tags/v}"
          fi
          echo "semver=$version" >> "$GITHUB_OUTPUT"
    
      - name: Buildah Build
        id: build_image
        uses: redhat-actions/buildah-build@v2
        with:
          containerfiles: |
            ./Containerfile
          image: ${{ env.IMAGE_NAME }}-x86 
          tags: ${{ github.sha }}
          build-args: |
            VERSION=${{ steps.semver.outputs.semver }}
            WINEARCH=win32
          
      # Push the image to GHCR (Image Registry)
      - name: Push To GHCR
        uses: redhat-actions/push-to-registry@v2
        id: push
        with:
          image: ${{ steps.build_image.outputs.image }}
          tags: ${{ steps.build_image.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
          extra-args: |
            --disable-content-trust

      - name: Push version and latest tags
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build_image.outputs.image }}
          tags: latest ${{ steps.semver.outputs.semver }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
          extra-args: |
            --disable-content-trust
      - name: Echo outputs
        run: |
          echo "${{ toJSON(steps.push.outputs) }}"

  build_x64:
    name: Build and push x64 image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Push to Registry action
        uses: actions/checkout@v4

      - name: Determine Inno Setup version
        id: semver
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version='${{ inputs.version }}'
          else
            version="${GITHUB_REF#refs/tags/v}"
          fi
          echo "semver=$version" >> "$GITHUB_OUTPUT"
    
      - name: Buildah Build
        id: build_image
        uses: redhat-actions/buildah-build@v2
        with:
          containerfiles: |
            ./Containerfile
          image: ${{ env.IMAGE_NAME }}-x64
          tags: ${{ github.sha }}
          build-args: |
            VERSION=${{ steps.semver.outputs.semver }}
            WINEARCH=win64
          
      # Push the image to GHCR (Image Registry)
      - name: Push To GHCR
        uses: redhat-actions/push-to-registry@v2
        id: push
        with:
          image: ${{ steps.build_image.outputs.image }}
          tags: ${{ steps.build_image.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
          extra-args: |
            --disable-content-trust

      - name: Push version and latest tags
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build_image.outputs.image }}
          tags: latest ${{ steps.semver.outputs.semver }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
          extra-args: |
            --disable-content-trust
      - name: Echo outputs
        run: |
          echo "${{ toJSON(steps.push.outputs) }}"
